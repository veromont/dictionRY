<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish vocab</title>
<style>
	:root {
		--bg: #fbfaf8;
		--fg: #1d1c1a;
		--muted: #75716b;
		--line: #e3e0da;
		--card: #ffffff;
		--accent: #c2410c;
		--warn-bg: #fff4e6;
		--warn-fg: #9a3412;
		--bad: #b91c1c;
		--good: #15803d;
		--flash: #fff0c2;
		--mark-bg: #fde68a;
		--mark-fg: #422006;
		--chip-bg: #f1eee8;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #16151a;
			--fg: #eceae6;
			--muted: #96918a;
			--line: #2e2c33;
			--card: #1e1d23;
			--accent: #fb923c;
			--warn-bg: #3a2410;
			--warn-fg: #fcd9b0;
			--bad: #f87171;
			--good: #4ade80;
			--flash: #43391a;
			--mark-bg: #5c4614;
			--mark-fg: #fde68a;
			--chip-bg: #2a282f;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 24px 16px 64px;
		background: var(--bg);
		color: var(--fg);
		font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	main { max-width: 640px; margin: 0 auto; }
	.top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
	h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
	h1 span { color: var(--muted); font-weight: 400; }
	.tabs { margin-left: auto; display: flex; gap: 4px; }
	.tabs button { font-size: 13px; padding: 3px 10px; border-radius: 999px; }
	.tabs button.on { background: var(--chip-bg); color: var(--fg); border-color: var(--line); }
	input, button, textarea, select {
		font: inherit;
		color: inherit;
		border-radius: 8px;
		border: 1px solid var(--line);
		background: var(--card);
	}
	input, textarea, select { padding: 10px 12px; width: 100%; }
	textarea { resize: vertical; }
	input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
	button { padding: 6px 10px; background: transparent; border-color: transparent; color: var(--muted); cursor: pointer; }
	button:hover { color: var(--fg); background: var(--bg); border-color: var(--line); }
	.add { display: flex; gap: 8px; margin-bottom: 10px; }
	.add input { font-size: 17px; }
	.add button { border-color: var(--line); background: var(--card); color: var(--fg); padding: 0 16px; }
	#sentenceForm { display: grid; grid-template-columns: 1fr 200px auto; gap: 8px; align-items: start; }
	[hidden] { display: none !important; }
	#sentenceForm textarea { font-size: 16px; }
	#sentenceForm button { padding: 10px 16px; }
	#search { margin-bottom: 14px; }
	#notice { display: none; margin-bottom: 12px; padding: 9px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 14px; }
	#notice.on { display: block; }
	ul { list-style: none; margin: 0; padding: 0; }
	li { border-bottom: 1px solid var(--line); padding: 11px 2px; }
	li.flash { animation: flash 1.4s ease-out; }
	@keyframes flash { from { background: var(--flash); } to { background: transparent; } }
	.row { display: flex; align-items: baseline; gap: 10px; }
	.es { font-weight: 600; cursor: pointer; }
	.gloss { color: var(--muted); flex: 1; min-width: 0; overflow-wrap: anywhere; }
	.gloss.pending { font-style: italic; opacity: 0.6; }
	.gloss.failed { color: var(--bad); }
	.badge { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; }
	.chip {
		font-size: 12px; padding: 1px 8px; border-radius: 999px;
		background: var(--chip-bg); border: 1px solid transparent; color: var(--muted); cursor: pointer;
	}
	.chip:hover { color: var(--fg); border-color: var(--line); background: var(--chip-bg); }
	.acts { display: flex; gap: 2px; opacity: 0; transition: opacity 0.1s; }
	li:hover .acts, li:focus-within .acts { opacity: 1; }
	.acts button { font-size: 13px; padding: 2px 7px; }
	.note { color: var(--muted); font-size: 14px; margin-top: 3px; }
	.pos { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
	.conj { display: grid; gap: 14px; }
	.tense { display: grid; gap: 5px; }
	.tense .conj-head .acts { margin-left: 4px; }
	.tense:hover .acts, .tense:focus-within .acts { opacity: 1; }
	.conj-head { display: flex; align-items: center; gap: 8px; }
	.conj-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
	.conj-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 16px; }
	.conj-cell { display: flex; gap: 8px; align-items: baseline; }
	.conj-cell .who { color: var(--muted); font-size: 12px; min-width: 64px; }
	.conj-cell .form { overflow-wrap: anywhere; }
	.conj-grid input { padding: 4px 8px; font-size: 14px; }
	.conj-buttons { display: flex; gap: 8px; }
	.conj-buttons button { border-color: var(--line); background: var(--card); font-size: 13px; }
	.editor { margin-top: 10px; display: grid; gap: 8px; }
	.editor label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
	.editor .buttons { display: flex; gap: 8px; }
	.editor .buttons button { border-color: var(--line); background: var(--card); }
	.panel { margin: 10px 0 4px; padding-left: 12px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
	.sentence { display: flex; align-items: flex-start; gap: 8px; }
	.sentence .body { flex: 1; min-width: 0; }
	.sentence .text { overflow-wrap: anywhere; }
	.meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
	.meta .chip { font-size: 11px; }
	mark { background: var(--mark-bg); color: var(--mark-fg); border-radius: 3px; padding: 0 2px; }
	.link { display: inline-flex; align-items: center; background: var(--chip-bg); border-radius: 999px; }
	.link .chip { background: transparent; padding-right: 3px; }
	.link.manual .chip { font-style: italic; }
	.link .unlink { font-size: 12px; line-height: 1; padding: 1px 7px 1px 2px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); }
	.link .unlink:hover { color: var(--bad); background: transparent; }
	.unlinked { font-style: italic; }
	.link-box { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
	.link-box input { width: 220px; padding: 5px 9px; font-size: 14px; }
	.link-box button { font-size: 13px; }
	.sentence-edit { display: grid; gap: 6px; }
	.more-tenses { justify-self: start; font-size: 13px; border-color: var(--line); background: var(--card); }
	#notice .chip { margin: 3px 2px 0 0; }
	li.review { display: grid; gap: 8px; }
	.choices { display: flex; flex-wrap: wrap; gap: 6px; }
	.choice { display: grid; text-align: left; gap: 1px; padding: 6px 10px; border-color: var(--line); background: var(--card); color: var(--fg); max-width: 100%; }
	.choice strong { font-weight: 600; }
	.choice span { font-size: 12px; color: var(--muted); }
	.choices .skip { font-size: 13px; }
	.sentence-edit .buttons { display: flex; gap: 8px; }
	.sentence-edit .buttons button { border-color: var(--line); background: var(--card); }
	.sentence-box { display: grid; gap: 6px; }
	.sentence-box .fields { display: grid; grid-template-columns: 1fr 180px; gap: 6px; }
	.sentence-box .hint { font-size: 12px; color: var(--muted); }
	.sentence-box .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
	.sentence-box .hint { flex: 1; min-width: 200px; }
	.add-sentence { border-color: var(--line); background: var(--card); color: var(--fg); font-size: 13px; }
	footer { margin-top: 22px; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
	footer button { font-size: 13px; padding: 4px 8px; }
	#state.saving { color: var(--muted); }
	#state.saved { color: var(--good); }
	#state.unsaved { color: var(--bad); font-weight: 600; }
	.empty { color: var(--muted); padding: 28px 2px; }
	@media (max-width: 560px) {
		.conj-grid { grid-template-columns: 1fr; }
		#sentenceForm { grid-template-columns: 1fr; }
		.sentence-box .fields { grid-template-columns: 1fr; }
		.acts { opacity: 1; }
	}
</style>
</head>
<body>
<main>
	<div class="top">
		<h1>Spanish vocab <span id="count"></span></h1>
		<div class="tabs">
			<button type="button" id="tabWords" class="on">words</button>
			<button type="button" id="tabSentences">sentences</button>
		</div>
	</div>

	<form class="add" id="addForm" autocomplete="off">
		<input id="addInput" placeholder="new word, e.g. el mapa" autofocus spellcheck="false">
		<button type="submit">Add</button>
	</form>

	<form id="sentenceForm" autocomplete="off" hidden>
		<textarea id="sentenceInput" rows="2" placeholder="a sentence you met your words in"></textarea>
		<input id="sentenceSource" placeholder="source (optional)">
		<button type="submit">Add</button>
	</form>

	<input id="search" placeholder="search…" autocomplete="off" spellcheck="false">

	<div id="notice"></div>
	<ul id="list"></ul>
	<datalist id="wordList"></datalist>

	<footer>
		<span id="state" class="saved">saved</span>
		<button id="checkBtn">Check against dictionary</button>
		<button id="exportBtn">Export JSON</button>
		<button id="importBtn">Import JSON</button>
		<input type="file" id="importFile" accept="application/json,.json" hidden>
	</footer>
</main>

<script src="text.js"></script>
<script src="store.js"></script>
<script>
const PENDING_KEY = "spanish-vocab-pending";

let filter = "";
let view = "words";
let editingId = null;
let openId = null;
let flashId = null;
let focusSentenceFor = null;
let conjEdit = null;
let sentenceEditId = null;
let linkingId = null;
let moreTenses = new Set();
let reviewItems = [];
let dictAvailable = true;
let saveTimer = null;
let retryTimer = null;
// Set when the file never loaded. Saving then would overwrite the real file with an empty one.
let loadFailed = false;

const el = {
	list: document.getElementById("list"),
	notice: document.getElementById("notice"),
	count: document.getElementById("count"),
	state: document.getElementById("state"),
	addForm: document.getElementById("addForm"),
	addInput: document.getElementById("addInput"),
	sentenceForm: document.getElementById("sentenceForm"),
	sentenceInput: document.getElementById("sentenceInput"),
	sentenceSource: document.getElementById("sentenceSource"),
	search: document.getElementById("search"),
	tabWords: document.getElementById("tabWords"),
	tabSentences: document.getElementById("tabSentences"),
	wordList: document.getElementById("wordList")
};

function setState(kind, text) {
	el.state.className = kind;
	el.state.textContent = text;
}

function notify(msg, actions) {
	el.notice.textContent = msg || "";
	for (const item of (msg && actions) || []) el.notice.append(" ", action(item.label, item.onClick, "chip"));
	el.notice.classList.toggle("on", Boolean(msg));
}

function scheduleSave() {
	if (loadFailed) {
		setState("unsaved", "not saved — the file never loaded, reload the page");
		return;
	}
	clearTimeout(saveTimer);
	setState("saving", "saving…");
	saveTimer = setTimeout(save, 400);
}

async function save() {
	const body = snapshot();
	try {
		const res = await fetch("/api/vocab", {
			method: "PUT",
			headers: { "Content-Type": "application/json" },
			body: body
		});
		if (!res.ok) throw new Error("HTTP " + res.status);
		localStorage.removeItem(PENDING_KEY);
		clearTimeout(retryTimer);
		retryTimer = null;
		setState("saved", "saved");
	} catch (err) {
		// Server down or machine slept: hold the data in the browser and keep trying.
		try { localStorage.setItem(PENDING_KEY, body); } catch (_) {}
		setState("unsaved", "unsaved — retrying");
		clearTimeout(retryTimer);
		retryTimer = setTimeout(save, 5000);
	}
}

// Every change goes through here: links are recomputed from the new state, then saved and drawn.
function changed() {
	relink();
	refreshWordList();
	scheduleSave();
	render();
}

function refreshWordList() {
	el.wordList.textContent = "";
	for (const word of db.words) {
		const option = document.createElement("option");
		option.value = word.es;
		el.wordList.append(option);
	}
}

function action(label, onClick, className) {
	const b = document.createElement("button");
	b.type = "button";
	b.textContent = label;
	if (className) b.className = className;
	b.addEventListener("click", onClick);
	return b;
}

function openWord(word) {
	view = "words";
	filter = word.es;
	el.search.value = word.es;
	openId = word.id;
	flashId = word.id;
	applyView();
	render();
}

// A linked word on a sentence: click the word to open it, × to unlink it here.
function linkChip(sentence, word) {
	const wrap = document.createElement("span");
	const manual = isManualLink(sentence.id, word.id);
	wrap.className = "link" + (manual ? " manual" : "");

	const chip = action(word.es, () => openWord(word), "chip");
	chip.title = manual ? "linked by hand" : "found in the text";

	const unlink = action("×", () => {
		unpinLink(sentence.id, word.id);
		changed();
	}, "unlink");
	unlink.title = "unlink " + word.es + " from this sentence";

	wrap.append(chip, unlink);
	return wrap;
}

function sentenceNode(sentence, words) {
	const linked = new Set(words.map(word => word.id));
	// A multi-word entry ("claro que si") is highlighted word by word.
	const phraseParts = new Set(words.filter(word => (word.key || "").includes(" ")).flatMap(word => word.key.split(" ")));
	const text = sentence.text;
	const frag = document.createDocumentFragment();
	const re = new RegExp(WORDS_IN_TEXT.source, "gu");
	let last = 0;
	let match;
	while ((match = re.exec(text))) {
		const hit = [...tokenWordIds(linkState.index, match[0])].some(id => linked.has(id)) || phraseParts.has(normKey(match[0]));
		if (!hit) continue;
		if (match.index > last) frag.append(text.slice(last, match.index));
		const mark = document.createElement("mark");
		mark.textContent = match[0];
		frag.append(mark);
		last = match.index + match[0].length;
	}
	if (last < text.length) frag.append(text.slice(last));
	return frag;
}

// Asks the server's dictionary. null = no answer (dictionary not built, or server unreachable).
async function dictLookup(query) {
	try {
		const res = await fetch("/api/dict?q=" + encodeURIComponent(query));
		if (res.status === 503) {
			dictAvailable = false;
			return null;
		}
		if (!res.ok) throw new Error("HTTP " + res.status);
		dictAvailable = true;
		return (await res.json()).candidates;
	} catch (err) {
		return null;
	}
}

// "first-person singular present indicative" → "yo, present"
function describeForm(tags) {
	const t = String(tags || "").split(" ");
	const person = t.includes("first-person") ? 0 : t.includes("second-person") ? 1 : t.includes("third-person") ? 2 : -1;
	const who = person < 0 ? "" : PRONOUNS[person + (t.includes("plural") ? 3 : 0)];
	const what = ["present", "preterite", "imperfect", "future", "conditional", "subjunctive", "imperative", "gerund", "participle", "feminine", "masculine", "plural"]
		.filter(tag => t.includes(tag) && !(who && tag === "plural"));
	return [who, what.join(" ")].filter(Boolean).join(", ") || "a form";
}

function candidateLabel(candidate) {
	return candidate.display + " · " + candidate.pos + (candidate.senses[0] ? " · " + candidate.senses[0] : "");
}

function newWord(es) {
	return { id: crypto.randomUUID(), es: es, key: normKey(es), auto: "", autoState: "none", gloss: "", pos: "other", notes: "", createdAt: Date.now(), updatedAt: Date.now() };
}

function openExisting(existing, raw) {
	notify(normKey(raw) === existing.key
		? '"' + existing.es + '" is already saved — opened it below instead of adding a duplicate.'
		: '"' + raw + '" is "' + existing.es + '", which is already saved — opened it below.');
	view = "words";
	filter = "";
	el.search.value = "";
	editingId = existing.id;
	flashId = existing.id;
	applyView();
	render();
}

function addPlainWord(raw) {
	const item = newWord(raw);
	db.words.unshift(item);
	changed();
	translateInto(item, false);
}

function addFromCandidate(candidate, raw) {
	const es = candidate.display;
	const existing = findWordByKey(normKey(es));
	if (existing) {
		openExisting(existing, raw);
		return;
	}
	const item = newWord(es);
	applyDictionary(item, candidate);
	db.words.unshift(item);

	let message = "";
	if (candidate.genderNote) message = 'Saved "' + es + '" — ' + candidate.genderNote + ".";
	else if (candidate.via === "form" && normKey(candidate.form || raw) !== normKey(es)) message = 'Saved "' + es + '" — "' + raw + '" is its ' + describeForm(candidate.formTags) + " form.";
	else if (es.toLowerCase() !== raw.toLowerCase()) message = 'Saved "' + es + '".';
	notify(message, message ? [{
		label: "keep " + raw,
		onClick: () => {
			removeWord(item.id);
			notify("");
			addPlainWord(raw);
		}
	}] : []);
	changed();
	if (!item.dict.senses.length) translateInto(item, false);
}

// --- checking existing words against the dictionary ---------------------------------------

// Everything that only adds information is applied straight away. Anything that would rename or
// merge a word goes on the review list.
async function checkAgainstDictionary() {
	const words = db.words.filter(word => word.dictReview !== "skipped");
	notify("Checking " + words.length + " words against the dictionary…");
	let filled = 0;
	const items = [];
	for (const word of words) {
		const candidates = await dictLookup(word.es);
		if (candidates === null && !dictAvailable) {
			notify("The dictionary isn't built yet — see README, section Dictionary.");
			return;
		}
		if (!candidates || !candidates.length) continue;
		// Filled in silently only when there is nothing to decide: the one answer has the same
		// spelling (accents included), or the word's part of speech picks out exactly one.
		// "claro" (adjective, adverb, interjection) or "como" next to "cómo" are asked about.
		const same = candidates.filter(c => c.via === "headword" && !c.genderNote && c.display.toLowerCase() === word.es.toLowerCase());
		const byPos = word.pos && word.pos !== "other" ? same.filter(c => c.pos === word.pos) : [];
		const pick = same.length === candidates.length && (same.length === 1 ? same[0] : byPos.length === 1 ? byPos[0] : null);
		if (pick) {
			applyDictionary(word, pick);
			filled++;
			continue;
		}
		items.push({ wordId: word.id, candidates: candidates });
	}
	reviewItems = items;
	if (items.length) setView("review");
	changed();
	notify("Filled in " + filled + " word" + (filled === 1 ? "" : "s") + " from the dictionary. "
		+ (items.length ? items.length + " need a decision below." : "Nothing needs a decision."));
}

function reviewReason(candidate) {
	if (candidate.genderNote) return candidate.genderNote;
	if (candidate.via === "headword") return "which meaning? · " + candidate.pos;
	if (candidate.via === "form") return "a form of " + candidate.headword + " (" + describeForm(candidate.formTags) + ")";
	if (candidate.via === "spelling") return "spelling";
	if (candidate.via === "similar") return "did you mean";
	return candidate.pos;
}

function finishReviewItem(item) {
	reviewItems = reviewItems.filter(other => other !== item);
	if (!reviewItems.length) {
		notify("Review done.");
		view = "words";
		applyView();
	}
	changed();
}

function acceptReview(item, candidate) {
	const word = db.words.find(other => other.id === item.wordId);
	if (!word) return finishReviewItem(item);
	const target = findWordByKey(normKey(candidate.display));
	if (target && target !== word) {
		mergeWordInto(word, target);
		applyDictionary(target, candidate);
	} else {
		word.es = candidate.display;
		word.key = normKey(candidate.display);
		applyDictionary(word, candidate);
		delete word.dictReview;
	}
	finishReviewItem(item);
}

function renderReview() {
	el.count.textContent = reviewItems.length + " to review";
	el.list.textContent = "";
	if (!reviewItems.length) {
		empty("nothing to review.");
		return;
	}
	for (const item of reviewItems) {
		const word = db.words.find(other => other.id === item.wordId);
		if (!word) continue;
		const li = document.createElement("li");
		li.className = "review";

		const head = document.createElement("div");
		head.className = "row";
		const es = document.createElement("span");
		es.className = "es";
		es.textContent = word.es;
		const now = document.createElement("span");
		now.className = "gloss";
		now.textContent = meaningOf(word).text;
		head.append(es, now);

		const choices = document.createElement("div");
		choices.className = "choices";
		for (const candidate of item.candidates) {
			const choice = action("", () => acceptReview(item, candidate), "choice");
			const title = document.createElement("strong");
			title.textContent = "→ " + candidate.display;
			const detail = document.createElement("span");
			detail.textContent = reviewReason(candidate) + (candidate.senses[0] ? " · " + candidate.senses.slice(0, 2).join("; ") : "");
			choice.append(title, detail);
			choices.append(choice);
		}
		choices.append(action("skip — keep " + word.es, () => {
			word.dictReview = "skipped";
			finishReviewItem(item);
		}, "skip"));

		li.append(head, choices);
		el.list.append(li);
	}
}

function render() {
	const q = normKey(filter);
	if (view === "review") renderReview();
	else if (view === "words") renderWords(q);
	else renderSentences(q);

	if (flashId) {
		const target = el.list.querySelector('[data-id="' + flashId + '"]');
		if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
		flashId = null;
	}
	if (focusSentenceFor) {
		const box = el.list.querySelector('[data-focus="' + focusSentenceFor + '"]');
		if (box) box.focus();
		focusSentenceFor = null;
	}
}

function renderWords(q) {
	const visible = q
		? db.words.filter(word => [word.es, word.gloss, word.auto, word.notes, meaningOf(word).text]
			.concat(linkedSentences(word.id).map(sentence => sentence.text + " " + sentence.source))
			.some(value => normKey(value).includes(q)))
		: db.words;

	el.count.textContent = q ? visible.length + " / " + db.words.length : String(db.words.length);
	el.list.textContent = "";

	if (!visible.length) {
		empty(db.words.length ? "nothing matches." : "no words yet. type one above.");
		return;
	}

	for (const item of visible) {
		const li = document.createElement("li");
		li.dataset.id = item.id;
		if (item.id === flashId) li.className = "flash";

		const row = document.createElement("div");
		row.className = "row";

		const es = document.createElement("span");
		es.className = "es";
		es.textContent = item.es;
		es.title = "show sentences";
		es.addEventListener("click", () => toggleSentences(item));

		const meaning = meaningOf(item);
		const gloss = document.createElement("span");
		gloss.className = "gloss";
		if (meaning.from === "pending") {
			gloss.className += " pending";
			gloss.textContent = "translating…";
		} else if (meaning.from === "none") {
			gloss.className += " failed";
			gloss.textContent = "no translation";
		} else {
			gloss.textContent = meaning.text;
		}

		row.append(es, gloss);

		if (meaning.from === "machine") {
			const badge = document.createElement("span");
			badge.className = "badge";
			badge.textContent = "auto";
			badge.title = "machine translation, not checked by you";
			row.append(badge);
		}

		if (item.pos && item.pos !== "other") {
			const pos = document.createElement("span");
			pos.className = "pos";
			pos.textContent = item.pos + (item.gender ? " · " + item.gender : "");
			row.append(pos);
		}

		const count = linkedSentences(item.id).length;
		if (count) {
			const chip = action(String(count), () => toggleSentences(item), "chip");
			chip.title = count + (count === 1 ? " sentence" : " sentences");
			row.append(chip);
		}

		const acts = document.createElement("div");
		acts.className = "acts";
		acts.append(
			action(count ? "sentences" : "+ sentence", () => toggleSentences(item)),
			action("edit", () => { editingId = editingId === item.id ? null : item.id; render(); }),
			action("retranslate", () => translateInto(item, true)),
			action("delete", () => {
				const kept = count ? "\n\nIts " + count + (count === 1 ? " sentence stays." : " sentences stay.") : "";
				if (!confirm('Delete "' + item.es + '"?' + kept)) return;
				removeWord(item.id);
				if (editingId === item.id) editingId = null;
				if (openId === item.id) openId = null;
				changed();
			})
		);
		row.append(acts);
		li.append(row);

		if ((item.notes || "").trim() && item.id !== editingId) {
			const note = document.createElement("div");
			note.className = "note";
			note.textContent = item.notes;
			li.append(note);
		}

		if (item.id === editingId) li.append(editor(item));
		if (item.id === openId) li.append(sentencePanel(item));
		el.list.append(li);
	}
}

function renderSentences(q) {
	const all = db.sentences.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
	const visible = q
		? all.filter(sentence => normKey(sentence.text + " " + sentence.source).includes(q)
			|| linkedWords(sentence.id).some(word => normKey(word.es).includes(q) || normKey(word.gloss || word.auto).includes(q)))
		: all;

	el.count.textContent = (q ? visible.length + " / " + all.length : String(all.length))
		+ (all.length === 1 ? " sentence" : " sentences");
	el.list.textContent = "";

	if (!visible.length) {
		empty(all.length ? "nothing matches." : "no sentences yet. paste one above, or open a word and add it there.");
		return;
	}

	for (const sentence of visible) {
		const li = document.createElement("li");
		li.dataset.id = sentence.id;
		if (sentence.id === flashId) li.className = "flash";
		li.append(sentenceRow(sentence, null));
		el.list.append(li);
	}
}

function empty(message) {
	const p = document.createElement("div");
	p.className = "empty";
	p.textContent = message;
	el.list.append(p);
}

// `hostWord` is the word whose panel this row sits in, so its own chip is not repeated back at it.
function sentenceRow(sentence, hostWord) {
	if (sentenceEditId === sentence.id) return sentenceEditor(sentence);

	const words = linkedWords(sentence.id);
	const wrap = document.createElement("div");
	wrap.className = "sentence";

	const body = document.createElement("div");
	body.className = "body";

	const text = document.createElement("div");
	text.className = "text";
	text.append(sentenceNode(sentence, words));
	body.append(text);

	const meta = document.createElement("div");
	meta.className = "meta";
	if (sentence.source) {
		const source = document.createElement("span");
		source.textContent = sentence.source;
		meta.append(source);
	}
	for (const word of words) {
		if (word === hostWord) continue;
		meta.append(linkChip(sentence, word));
	}
	if (!words.length) {
		const none = document.createElement("span");
		none.className = "unlinked";
		none.textContent = "none of your words appear in it yet";
		meta.append(none);
	}
	if (meta.childNodes.length) body.append(meta);

	if (linkingId === sentence.id) body.append(linkBox(sentence));

	const acts = document.createElement("div");
	acts.className = "acts";
	acts.append(
		action("+ word", () => {
			linkingId = linkingId === sentence.id ? null : sentence.id;
			if (linkingId) focusSentenceFor = "link-" + sentence.id;
			render();
		}),
		action("edit", () => {
			sentenceEditId = sentence.id;
			focusSentenceFor = "edit-" + sentence.id;
			render();
		})
	);
	if (hostWord) {
		acts.append(action("unlink", () => {
			unpinLink(sentence.id, hostWord.id);
			changed();
		}));
	}
	acts.append(action("delete", () => {
		const shared = words.length > 1 ? "\n\nIt is linked to " + words.length + " words." : "";
		if (!confirm("Delete this sentence?" + shared)) return;
		removeSentence(sentence.id);
		changed();
	}));

	wrap.append(body, acts);
	return wrap;
}

function linkBox(sentence) {
	const box = document.createElement("div");
	box.className = "link-box";

	const input = document.createElement("input");
	input.setAttribute("list", "wordList");
	input.placeholder = "link a saved word";
	input.dataset.focus = "link-" + sentence.id;

	function commit() {
		const raw = input.value.trim();
		if (!raw) return;
		const word = resolveWord(raw);
		if (!word) {
			notify('"' + raw + '" isn\'t saved yet — add it as a word first.');
			return;
		}
		pinLink(sentence.id, word.id);
		linkingId = null;
		notify("");
		changed();
	}

	input.addEventListener("keydown", e => {
		if (e.key === "Enter") { e.preventDefault(); commit(); }
		if (e.key === "Escape") { linkingId = null; render(); }
	});

	box.append(input, action("link", commit), action("cancel", () => { linkingId = null; render(); }));
	return box;
}

function sentenceEditor(sentence) {
	const wrap = document.createElement("div");
	wrap.className = "sentence-edit";

	const textInput = document.createElement("textarea");
	textInput.rows = 2;
	textInput.value = sentence.text;
	textInput.dataset.focus = "edit-" + sentence.id;

	const sourceInput = document.createElement("input");
	sourceInput.value = sentence.source || "";
	sourceInput.placeholder = "source (optional)";

	function commit() {
		const text = textInput.value.trim();
		if (!text) return;
		const clash = findSentenceByText(text, sentence.id);
		if (clash) {
			notify("You already have that sentence — edit cancelled.");
			return;
		}
		editSentence(sentence, text, sourceInput.value);
		sentenceEditId = null;
		notify("");
		changed();
	}

	wrap.addEventListener("keydown", e => {
		if (e.key === "Enter" && !e.shiftKey && e.target === textInput) { e.preventDefault(); commit(); }
		if (e.key === "Escape") { sentenceEditId = null; render(); }
	});

	const buttons = document.createElement("div");
	buttons.className = "buttons";
	buttons.append(action("save", commit), action("cancel", () => { sentenceEditId = null; render(); }));

	wrap.append(textInput, sourceInput, buttons);
	return wrap;
}

function toggleSentences(item) {
	const opening = openId !== item.id;
	openId = opening ? item.id : null;
	notify("");
	if (opening) focusSentenceFor = "add-" + item.id;
	render();
}

function conjugationBlock(item) {
	const wrap = document.createElement("div");
	wrap.className = "conj";

	const tenses = TENSES.filter(tense => item.conj[tense] && Array.isArray(item.conj[tense].forms));
	const all = moreTenses.has(item.id);
	for (const tense of all ? tenses : tenses.slice(0, 1)) wrap.append(tenseBlock(item, tense, item.conj[tense]));
	if (tenses.length > 1) {
		wrap.append(action(all ? "fewer tenses" : "more tenses (" + (tenses.length - 1) + ")", () => {
			if (all) moreTenses.delete(item.id); else moreTenses.add(item.id);
			render();
		}, "more-tenses"));
	}
	return wrap;
}

function tenseBlock(item, tense, block) {
	const wrap = document.createElement("div");
	wrap.className = "tense";

	const head = document.createElement("div");
	head.className = "conj-head";

	const title = document.createElement("span");
	title.className = "conj-title";
	title.textContent = TENSE_LABELS[tense];

	const badge = document.createElement("span");
	badge.className = "badge";
	badge.textContent = block.source;
	badge.title = block.source === "yours"
		? "you corrected these"
		: block.source === "dictionary"
			? "from Wiktionary"
			: "built by the old rules engine — run Check against dictionary to replace it";

	head.append(title, badge);

	const editing = conjEdit && conjEdit.id === item.id && conjEdit.tense === tense;
	const buttons = document.createElement("div");
	buttons.className = "acts";
	head.append(buttons);
	wrap.append(head);

	const grid = document.createElement("div");
	grid.className = "conj-grid";
	const inputs = [];

	// Singular down the left column, plural down the right, the way conjugation tables read.
	const order = [0, 3, 1, 4, 2, 5].map(i => [PRONOUNS[i], block.forms[i], i]);
	if (tense === "present") order.push(["gerund", item.conj.gerund || "", 6], ["participle", item.conj.participle || "", 7]);

	for (const [who, form, index] of order) {
		const cell = document.createElement("div");
		cell.className = "conj-cell";

		const label = document.createElement("span");
		label.className = "who";
		label.textContent = who;
		cell.append(label);

		if (editing) {
			const input = document.createElement("input");
			input.value = form;
			inputs[index] = input;
			cell.append(input);
		} else {
			const value = document.createElement("span");
			value.className = "form";
			value.textContent = form;
			cell.append(value);
		}
		grid.append(cell);
	}
	wrap.append(grid);

	if (editing) {
		const bar = document.createElement("div");
		bar.className = "conj-buttons";
		bar.append(
			action("save", () => {
				item.conj[tense] = { source: "yours", forms: inputs.slice(0, 6).map(input => input.value.trim()) };
				if (tense === "present") {
					item.conj.gerund = inputs[6].value.trim();
					item.conj.participle = inputs[7].value.trim();
				}
				item.updatedAt = Date.now();
				conjEdit = null;
				changed();
			}),
			action("cancel", () => { conjEdit = null; render(); })
		);
		wrap.append(bar);
	} else {
		buttons.append(
			action("edit", () => { conjEdit = { id: item.id, tense: tense }; render(); }),
			item.dict ? action("reset", async () => {
				if (block.source === "yours" && !confirm("Replace your " + TENSE_LABELS[tense] + " with the dictionary's?")) return;
				const candidates = await dictLookup(item.dict.headword);
				const match = candidates && candidates.find(c => c.headword === item.dict.headword && c.pos === "verb" && c.conj && c.conj[tense]);
				if (!match) {
					notify("The dictionary has no " + TENSE_LABELS[tense] + " for " + item.es + ".");
					return;
				}
				item.conj[tense] = match.conj[tense];
				if (tense === "present") {
					item.conj.gerund = match.conj.gerund || "";
					item.conj.participle = match.conj.participle || "";
				}
				item.updatedAt = Date.now();
				changed();
			}) : ""
		);
	}
	return wrap;
}

function sentencePanel(item) {
	const panel = document.createElement("div");
	panel.className = "panel";

	if (item.conj && item.conj.present) panel.append(conjugationBlock(item));

	for (const sentence of linkedSentences(item.id)) panel.append(sentenceRow(sentence, item));

	const box = document.createElement("div");
	box.className = "sentence-box";

	const fields = document.createElement("div");
	fields.className = "fields";

	const textInput = document.createElement("textarea");
	textInput.rows = 2;
	textInput.placeholder = "sentence you met " + item.es + " in";
	textInput.dataset.focus = "add-" + item.id;

	const sourceInput = document.createElement("input");
	sourceInput.placeholder = "source (optional)";

	fields.append(textInput, sourceInput);

	function commit() {
		const text = textInput.value.trim();
		if (!text) return;
		const existing = findSentenceByText(text);
		if (existing) {
			pinLink(existing.id, item.id);
			notify("You already had that sentence — linked it to " + item.es + ".");
		} else {
			const sentence = createSentence(text, sourceInput.value);
			// Stored by hand only when the text alone wouldn't link it, e.g. a preterite form.
			if (!matchedWordIds(linkState.index, sentence.text).has(item.id)) pinLink(sentence.id, item.id);
			const others = [...matchedWordIds(linkState.index, sentence.text)]
				.filter(id => id !== item.id)
				.map(id => db.words.find(word => word.id === id).es);
			notify(others.length ? "Also linked to " + others.join(", ") + "." : "");
		}
		focusSentenceFor = "add-" + item.id;
		changed();
	}

	const bar = document.createElement("div");
	bar.className = "bar";

	const hint = document.createElement("div");
	hint.className = "hint";
	hint.textContent = "Enter saves · Shift+Enter for a new line · any other saved word in it links too";

	const addButton = action("add sentence", commit);
	addButton.className = "add-sentence";
	bar.append(hint, addButton);

	textInput.addEventListener("keydown", e => {
		if (e.key !== "Enter" || e.shiftKey) return;
		e.preventDefault();
		commit();
	});

	box.append(fields, bar);
	panel.append(box);
	return panel;
}

function editor(item) {
	const wrap = document.createElement("div");
	wrap.className = "editor";

	const glossField = document.createElement("div");
	const glossLabel = document.createElement("label");
	const suggested = item.dict && item.dict.senses.length ? "dictionary: " + item.dict.senses.slice(0, 3).join("; ") : item.auto ? "machine says: " + item.auto : "";
	glossLabel.textContent = suggested ? "your gloss (" + suggested + ")" : "your gloss";
	const glossInput = document.createElement("input");
	glossInput.value = item.gloss || "";
	glossInput.placeholder = "leave empty to show the meaning above";
	glossField.append(glossLabel, glossInput);

	const esField = document.createElement("div");
	const esLabel = document.createElement("label");
	esLabel.textContent = "spanish";
	const esInput = document.createElement("input");
	esInput.value = item.es;
	esField.append(esLabel, esInput);

	const posField = document.createElement("div");
	const posLabel = document.createElement("label");
	posLabel.textContent = "part of speech";
	const posSelect = document.createElement("select");
	for (const value of POS_OPTIONS.includes(item.pos) ? POS_OPTIONS : POS_OPTIONS.concat(item.pos || [])) {
		const option = document.createElement("option");
		option.value = value;
		option.textContent = value;
		posSelect.append(option);
	}
	posSelect.value = item.pos || "other";
	posField.append(posLabel, posSelect);

	const notesField = document.createElement("div");
	const notesLabel = document.createElement("label");
	notesLabel.textContent = "notes";
	const notesInput = document.createElement("textarea");
	notesInput.rows = 2;
	notesInput.value = item.notes || "";
	notesField.append(notesLabel, notesInput);

	function commit() {
		const es = esInput.value.trim();
		let renamed = false;
		if (es) {
			const key = normKey(es);
			const clash = db.words.find(x => x.key === key && x.id !== item.id);
			if (clash) {
				notify('"' + clash.es + '" already uses that word — rename cancelled.');
			} else if (key !== item.key) {
				item.es = es;
				item.key = key;
				renamed = true;
			}
		}
		item.gloss = glossInput.value.trim();
		item.notes = notesInput.value.trim();
		item.pos = posSelect.value;
		if (renamed) delete item.dictReview;
		normalizeWord(item);
		item.updatedAt = Date.now();
		editingId = null;
		changed();
	}

	const buttons = document.createElement("div");
	buttons.className = "buttons";
	buttons.append(
		action("save", commit),
		action("cancel", () => { editingId = null; render(); })
	);

	wrap.addEventListener("keydown", e => {
		if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); commit(); }
		if (e.key === "Escape") { editingId = null; render(); }
	});

	wrap.append(glossField, esField, posField, notesField, buttons);
	setTimeout(() => { glossInput.focus(); glossInput.select(); }, 0);
	return wrap;
}

async function translateInto(item, force) {
	if (item.autoState === "ok" && item.auto && !force) return;
	item.autoState = "pending";
	render();
	try {
		const res = await fetch("/api/translate?q=" + encodeURIComponent(item.es));
		const body = await res.json();
		if (!res.ok) throw new Error(body.error || res.status);
		item.auto = body.text;
		item.autoState = "ok";
	} catch (err) {
		item.autoState = "failed";
	}
	item.updatedAt = Date.now();
	scheduleSave();
	render();
}

function applyView() {
	const words = view === "words";
	el.tabWords.classList.toggle("on", words);
	el.tabSentences.classList.toggle("on", view === "sentences");
	el.addForm.hidden = !words;
	el.sentenceForm.hidden = view !== "sentences";
	el.search.hidden = view === "review";
	el.search.placeholder = words ? "search…" : "search sentences…";
}

function setView(next) {
	if (view === next) return;
	view = next;
	notify("");
	applyView();
	render();
	if (view !== "review") (view === "words" ? el.addInput : el.sentenceInput).focus();
}

el.tabWords.addEventListener("click", () => setView("words"));
el.tabSentences.addEventListener("click", () => setView("sentences"));

el.addForm.addEventListener("submit", async e => {
	e.preventDefault();
	const raw = el.addInput.value.trim();
	if (!raw) return;
	el.addInput.value = "";
	el.addInput.focus();

	const existing = findWordByKey(normKey(raw));
	if (existing) {
		openExisting(existing, raw);
		return;
	}

	const candidates = await dictLookup(raw);
	if (!candidates || !candidates.length) {
		addPlainWord(raw);
		if (!dictAvailable) notify("Saved as typed — the dictionary isn't built yet, so this uses machine translation.");
		return;
	}

	// One clear answer is saved straight away; anything else is a choice, and nothing is saved
	// until you pick.
	if (candidates.length === 1 && candidates[0].via !== "similar") {
		addFromCandidate(candidates[0], raw);
		return;
	}
	const exact = candidates.filter(c => c.via === "headword" || c.via === "form");
	const question = exact.length
		? '"' + raw + '" could be:'
		: 'Nothing called "' + raw + '" — did you mean:';
	notify(question, candidates.map(candidate => ({
		label: candidateLabel(candidate),
		onClick: () => addFromCandidate(candidate, raw)
	})).concat([{ label: "keep " + raw, onClick: () => { notify(""); addPlainWord(raw); } }]));
});

el.sentenceForm.addEventListener("submit", e => {
	e.preventDefault();
	const text = el.sentenceInput.value.trim();
	if (!text) return;

	const existing = findSentenceByText(text);
	if (existing) {
		notify("You already have that sentence — it's highlighted below.");
		filter = "";
		el.search.value = "";
		flashId = existing.id;
		render();
		return;
	}

	const sentence = createSentence(text, el.sentenceSource.value);
	el.sentenceInput.value = "";
	el.sentenceSource.value = "";
	el.sentenceInput.focus();
	changed();

	const words = linkedWords(sentence.id).map(word => word.es);
	notify(words.length
		? "Linked to " + words.join(", ") + "."
		: "Saved. None of your words appear in it yet — it will link up as you add them.");
});

el.sentenceInput.addEventListener("keydown", e => {
	if (e.key !== "Enter" || e.shiftKey) return;
	e.preventDefault();
	el.sentenceForm.requestSubmit();
});

el.search.addEventListener("input", e => { filter = e.target.value; render(); });

document.addEventListener("keydown", e => {
	const tag = document.activeElement.tagName;
	if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
		e.preventDefault();
		el.search.focus();
	}
});

document.getElementById("checkBtn").addEventListener("click", () => checkAgainstDictionary());

document.getElementById("exportBtn").addEventListener("click", () => {
	const blob = new Blob([snapshot()], { type: "application/json" });
	const a = document.createElement("a");
	a.href = URL.createObjectURL(blob);
	a.download = "vocab-" + new Date().toISOString().slice(0, 10) + ".json";
	a.click();
	URL.revokeObjectURL(a.href);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());

document.getElementById("importFile").addEventListener("change", async e => {
	const file = e.target.files[0];
	if (!file) return;
	e.target.value = "";
	let incoming;
	try {
		incoming = loadAny(JSON.parse(await file.text())).db;
	} catch (err) {
		notify("That file isn't a vocab export.");
		return;
	}
	const result = mergeDb(incoming);
	notify("Imported " + result.addedWords + " new word" + (result.addedWords === 1 ? "" : "s")
		+ " (" + result.skippedWords + " already saved) and " + result.addedSentences + " new sentence"
		+ (result.addedSentences === 1 ? "" : "s") + ".");
	changed();
});

function conversionNotice(loaded) {
	const lines = [];
	if (loaded.renamed.length) lines.push("saved under the infinitive: " + loaded.renamed.map(entry => entry.from + " → " + entry.to).join(", "));
	if (loaded.merged.length) lines.push("folded into the verb already saved: " + loaded.merged.map(entry => entry.from + " → " + entry.to).join(", "));
	if (!lines.length) return;
	const undoRename = loaded.renamed.map(entry => ({
		label: "keep " + entry.from,
		onClick: () => {
			entry.word.es = entry.from;
			entry.word.key = normKey(entry.from);
			entry.word.pos = "other";
			delete entry.word.conj;
			notify("");
			changed();
		}
	}));
	const undoMerge = loaded.merged.map(entry => ({
		label: "keep " + entry.from,
		onClick: () => {
			entry.word.pos = "other";
			delete entry.word.conj;
			db.words.unshift(entry.word);
			notify("");
			changed();
		}
	}));
	notify(lines.join("; ") + ".", undoRename.concat(undoMerge));
}

(async function start() {
	let loaded;
	try {
		// no-store, or a reload can be handed a stale body.
		const res = await fetch("/api/vocab", { cache: "no-store" });
		if (!res.ok) throw new Error("HTTP " + res.status);
		loaded = loadAny(await res.json());
		setState("saved", "saved");
	} catch (err) {
		loadFailed = true;
		loaded = { db: emptyDb(), renamed: [], merged: [], converted: false };
		setState("unsaved", "cannot reach server");
		notify("Could not load vocab.json — is the server running? Nothing you type here will be saved until you reload.");
	}
	db = loaded.db;
	relink();
	if (loaded.converted) scheduleSave();

	const pending = localStorage.getItem(PENDING_KEY);
	if (pending && !loadFailed) {
		let parsed = null;
		try { parsed = JSON.parse(pending); } catch (_) {}
		// An old-format buffer next to an already-converted file can only come from a tab that was
		// still running the previous version; it is older than the file, so it is dropped.
		const stale = Array.isArray(parsed) && !loaded.converted;
		if (parsed && !stale && pending !== snapshot() && confirm("There are unsaved changes from last time. Restore them?")) {
			try {
				db = loadAny(parsed).db;
				relink();
				scheduleSave();
			} catch (_) {}
		} else {
			localStorage.removeItem(PENDING_KEY);
		}
	}

	refreshWordList();
	applyView();
	render();
	conversionNotice(loaded);
})();
</script>
</body>
</html>
