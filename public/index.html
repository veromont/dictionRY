<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
	<header class="top">
		<div class="brand">
			<div class="logo" aria-hidden="true">ñ</div>
			<div>
				<h1 class="brand-name">Vocabulario</h1>
				<span class="brand-sub" id="count"></span>
			</div>
		</div>
		<button class="study-now" id="studyNow" type="button" hidden></button>
	</header>

	<nav class="tabs" id="tabs" aria-label="Word lists"></nav>

	<div class="tools" id="tools">
		<form class="add" id="addForm" autocomplete="off">
			<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A2A8B3" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
			<label for="addInput" class="sr">Add a word</label>
			<input id="addInput" placeholder="Add a word — e.g. el mapa" spellcheck="false">
			<button type="submit">Add</button>
		</form>
		<div class="search" id="searchBox">
			<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A919C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
			<label for="search" class="sr">Search</label>
			<input id="search" autocomplete="off" spellcheck="false">
		</div>
	</div>

	<form class="composer" id="sentenceForm" autocomplete="off" hidden>
		<label for="sentenceInput">A sentence you met your words in</label>
		<textarea id="sentenceInput" rows="2" placeholder="¿Qué te parece si salimos después de clases?"></textarea>
		<div class="composer-bar">
			<input id="sentenceSource" aria-label="Source (optional)" placeholder="Source (optional)">
			<button class="btn accent" type="submit">Add sentence</button>
		</div>
	</form>

	<form class="composer" id="groupForm" autocomplete="off" hidden>
		<span class="composer-label">Words you mix up</span>
		<div class="group-inputs" id="groupInputs"></div>
		<div class="composer-bar">
			<button class="btn" id="addGroupInput" type="button">+ another word</button>
			<input id="groupNote" aria-label="Note (optional)" placeholder="Note (optional) — g vs v">
			<button class="btn accent" type="submit">Create group</button>
		</div>
	</form>

	<div id="notice" role="status"></div>
	<main id="content"></main>
	<datalist id="wordList"></datalist>

	<footer id="footer">
		<span id="state" class="save-state">Saved</span>
		<button id="checkBtn" type="button">Check against dictionary</button>
		<button id="exportBtn" type="button">Export JSON</button>
		<button id="importBtn" type="button">Import JSON</button>
		<input type="file" id="importFile" accept="application/json,.json" hidden>
	</footer>
</div>

<script src="text.js"></script>
<script src="store.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
